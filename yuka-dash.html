<title>ゆかダッシュ！ | Y.U.K.A LAB</title>
<style>
  :root{ --ink:#2b2140; --pink:#ff7eb6; --lav:#b79ced; }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    background:linear-gradient(180deg,#241b3a 0%,#3a2a5e 60%,#57386e 100%);
    color:#fff; display:flex; flex-direction:column; align-items:center;
    min-height:100dvh; overflow:hidden; user-select:none; -webkit-user-select:none;
    touch-action:manipulation;
  }
  header{ padding:10px 12px 4px; text-align:center; }
  header h1{ font-size:clamp(20px,5.5vw,30px); letter-spacing:.06em; text-shadow:0 2px 0 rgba(0,0,0,.35); }
  header h1 .sakura{ color:var(--pink); }
  header p{ font-size:12px; opacity:.85; margin-top:2px; }
  #wrap{ position:relative; width:min(960px,100vw); flex:1; display:flex; align-items:center; }
  canvas{ width:100%; display:block; background:#1d1430; }
  #hud{
    position:absolute; top:8px; left:0; right:0; display:flex; justify-content:space-between;
    padding:0 14px; font-weight:700; font-size:clamp(14px,3.8vw,19px); pointer-events:none;
    text-shadow:0 2px 4px rgba(0,0,0,.6);
  }
  #hud .best{ opacity:.85; font-size:.82em; text-align:right; }
  #overlay{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:rgba(20,12,38,.45); text-align:center; padding:20px;
  }
  #overlay.hidden{ display:none; }
  #ovTitle{ font-size:clamp(24px,7vw,42px); font-weight:900; letter-spacing:.05em; text-shadow:0 3px 0 rgba(0,0,0,.4); }
  #ovText{ font-size:clamp(13px,3.6vw,16px); line-height:1.7; opacity:.95; white-space:pre-line; }
  #startBtn{
    font:inherit; font-weight:900; font-size:clamp(16px,4.5vw,20px); color:#fff; cursor:pointer;
    background:linear-gradient(180deg,#ff9ec7,#ff5da2); border:3px solid #fff; border-radius:999px;
    padding:12px 38px; box-shadow:0 6px 0 #c23377, 0 10px 18px rgba(0,0,0,.4);
  }
  #startBtn:active{ transform:translateY(4px); box-shadow:0 2px 0 #c23377; }
  #muteBtn{
    position:absolute; right:10px; bottom:10px; z-index:5; font-size:20px; width:46px; height:46px;
    border-radius:50%; border:2px solid rgba(255,255,255,.7); background:rgba(30,20,55,.65); color:#fff; cursor:pointer;
  }
  footer{ padding:6px 10px 12px; font-size:12px; opacity:.8; text-align:center; }
  kbd{ background:#fff2; border:1px solid #fff6; border-bottom-width:3px; border-radius:6px; padding:0 6px; font-family:inherit; }
</style>

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const startBtn = document.getElementById('startBtn');
  const distEl = document.getElementById('dist');
  const bestEl = document.getElementById('best');
  const pctEl = document.getElementById('pct');
  const muteBtn = document.getElementById('muteBtn');


  // ---------- sizing ----------
  let W = 960, H = 420, DPR = 1;
  function resize() {
    const w = canvas.parentElement.clientWidth;
    W = w; H = Math.max(300, Math.min(460, Math.round(w * 0.46)));
    DPR = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);

  // ---------- audio ----------
  let AC = null, muted = false, musicTimer = null, step = 0;
  function audio() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function blip(f0, f1, dur, type, vol) {
    const ac = audio(); if (!ac || muted) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), ac.currentTime + dur);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
  }
  const sfxJump = () => blip(520, 940, 0.09, 'square', 0.05);
  const sfxDie = () => { blip(320, 50, 0.28, 'sawtooth', 0.09); blip(140, 40, 0.3, 'square', 0.06); };
  const NOTES = [220, 220, 261.6, 329.6, 220, 220, 392, 329.6, 174.6, 174.6, 220, 261.6, 196, 246.9, 293.7, 246.9];
  function startMusic() {
    if (musicTimer) return;
    musicTimer = setInterval(() => {
      if (muted || state !== 'play') return;
      const f = NOTES[step % NOTES.length];
      blip(f, f, 0.16, 'triangle', 0.045);
      if (step % 2 === 0) blip(f / 2, f / 2, 0.2, 'sine', 0.05);
      step++;
    }, 214); // ~140 BPM eighth notes
  }
  muteBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });

  // ---------- game state ----------
  const GROUND_H = 64;
  const SIZE = 46;
  const GRAV = 2700, JUMP_V = 980;
  let state = 'title'; // title | play | dead
  let player, obstacles, dust = [], distPx, speed, spawnX, attempts = 0, deadTimer = 0, shake = 0;
  let best = Number(localStorage.getItem('yuka-dash-best') || 0);
  bestEl.textContent = Math.floor(best);

  const petals = Array.from({ length: 22 }, () => ({
    x: Math.random() * 2000, y: Math.random() * 600,
    s: 4 + Math.random() * 6, vy: 12 + Math.random() * 22, ph: Math.random() * Math.PI * 2
  }));

  function groundY() { return H - GROUND_H; }

  function reset() {
    player = { y: groundY() - SIZE, vy: 0, grounded: true, wasGrounded: true, sx: 1, sy: 1, tilt: 0, runPhase: 0, strideIdx: 0, landT: 0 };
    obstacles = [];
    dust = [];
    distPx = 0; speed = 335; spawnX = W + 260;
    deadTimer = 0;
  }

  // ---------- obstacles ----------
  function addSpike(x) { obstacles.push({ t: 'spike', x, w: 30, h: 42 }); }
  function addBlock(x, h, spikeTop) {
    obstacles.push({ t: 'block', x, w: 46, h });
    if (spikeTop) obstacles.push({ t: 'spike', x: x + 8, w: 30, h: 42, onBlock: h });
  }
  function spawnPattern() {
    const r = Math.random();
    const x = spawnX;
    let width;
    if (r < 0.30) { addSpike(x); width = 30; }
    else if (r < 0.52) { addSpike(x); addSpike(x + 32); width = 62; }
    else if (r < 0.66 && distPx > 2600) { addSpike(x); addSpike(x + 32); addSpike(x + 64); width = 94; }
    else if (r < 0.82) { addBlock(x, 46, Math.random() < 0.4); width = 46; }
    else { addBlock(x, 92, false); addBlock(x + 48, 92, Math.random() < 0.5); width = 94; }
    const gap = speed * (0.62 + Math.random() * 0.5) + 130;
    spawnX = x + width + gap;
  }

  // ---------- input ----------
  function jump() {
    if (state === 'play' && player.grounded) {
      player.vy = -JUMP_V; player.grounded = false; player.landT = 0;
      sfxJump();
    }
  }
  function press() {
    if (state === 'title') startGame();
    else if (state === 'play') jump();
  }
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); if (!e.repeat) press(); }
  });
  canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); press(); });
  overlay.addEventListener('pointerdown', (e) => { if (e.target === overlay) press(); });
  startBtn.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });

  function startGame() {
    audio(); startMusic();
    attempts++;
    reset();
    state = 'play';
    overlay.classList.add('hidden');
  }

  function die() {
    state = 'dead'; deadTimer = 0; shake = 9;
    sfxDie();
    const m = distPx / 50;
    if (m > best) { best = m; localStorage.setItem('yuka-dash-best', String(best)); bestEl.textContent = Math.floor(best); }
  }

  // ---------- update ----------
  function update(dt) {
    // petals always drift
    for (const p of petals) {
      p.y += p.vy * dt; p.x -= (18 + speed * 0.04) * dt; p.ph += dt * 2;
      if (p.y > H + 12) { p.y = -12; p.x = Math.random() * (W + 200); }
      if (p.x < -20) p.x = W + 20;
    }
    // dust drifts in every state
    for (const d of dust) { d.x += (d.vx - speed * 0.22) * dt; d.y += d.vy * dt; d.vy -= 26 * dt; d.life -= dt; }
    dust = dust.filter(d => d.life > 0);
    if (state !== 'play') return;
    speed = Math.min(640, speed + 7.5 * dt);
    distPx += speed * dt;

    // spawn
    spawnX -= speed * dt;
    while (spawnX < W + 320) spawnPattern();
    for (const o of obstacles) o.x -= speed * dt;
    obstacles = obstacles.filter(o => o.x + o.w > -80);

    // player physics
    const gy = groundY();
    player.vy += GRAV * dt;
    player.y += player.vy * dt;
    player.grounded = false;

    // land on blocks
    let floorY = gy - SIZE;
    for (const o of obstacles) {
      if (o.t !== 'block') continue;
      const top = gy - o.h - SIZE;
      const overlapX = (30 > o.x - 8) && (30 + SIZE - 14 < o.x + o.w + 8) && (30 + SIZE > o.x + 6) && (30 < o.x + o.w - 6);
      if (overlapX && player.y >= top - 2 && player.y < top + 30 && player.vy >= 0) floorY = Math.min(floorY, top);
    }
    if (player.y >= floorY) {
      if (!player.wasGrounded && player.vy > 240) {
        // 着地モーション：着地ポーズ＋土煙
        player.landT = 0.24;
        for (let i = 0; i < 7; i++) dust.push({ x: 30 + 4 + Math.random() * SIZE, y: floorY + SIZE - 2, vx: -40 - Math.random() * 90, vy: -14 - Math.random() * 42, life: 0.34, max: 0.34, s: 3 + Math.random() * 4 });
        shake = Math.max(shake, 1.6);
      }
      player.y = floorY; player.vy = 0; player.grounded = true;
    }
    player.wasGrounded = player.grounded;

    // ---------- animation ----------
    if (player.landT > 0) player.landT -= dt;
    if (player.grounded) {
      // 走る動作：歩幅の位相でイラスト2枚を切り替え、足元に土煙
      player.runPhase += dt * (7 + speed / 52);
      const sIdx = Math.floor(player.runPhase / Math.PI);
      if (sIdx !== player.strideIdx) {
        player.strideIdx = sIdx;
        dust.push({ x: 30 + 4, y: player.y + SIZE - 2, vx: -50 - Math.random() * 60, vy: -8 - Math.random() * 22, life: 0.3, max: 0.3, s: 2.5 + Math.random() * 3 });
      }
    }

    // collisions
    const px = 30 + 7, pw = SIZE - 14, py = player.y + 6, ph = SIZE - 10;
    for (const o of obstacles) {
      if (o.t === 'spike') {
        const base = gy - (o.onBlock || 0);
        const sx = o.x + o.w * 0.30, sw = o.w * 0.40;
        const sy = base - o.h * 0.55, sh = o.h * 0.55;
        if (px < sx + sw && px + pw > sx && py < sy + sh && py + ph > sy) { die(); return; }
      } else {
        const bx = o.x + 3, bw = o.w - 6, by = gy - o.h, bh = o.h;
        const onTop = player.grounded && Math.abs((player.y + SIZE) - by) < 3;
        if (!onTop && px < bx + bw && px + pw > bx && py < by + bh && py + ph > by + 6) { die(); return; }
      }
    }

    distEl.textContent = Math.floor(distPx / 50) + ' m';
    pctEl.textContent = 'SPEED ' + Math.round(speed / 6.4) + '%';
  }

  // ---------- draw ----------
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) { ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake); shake *= 0.86; if (shake < 0.4) shake = 0; }

    // bg gradient
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#2a1c49'); g.addColorStop(0.7, '#4a2f6d'); g.addColorStop(1, '#5d3a72');
    ctx.fillStyle = g; ctx.fillRect(-12, -12, W + 24, H + 24);

    // parallax grid (Geometry Dash vibe)
    const gy = groundY();
    ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 1;
    const grid = 46, off = -(distPx * 0.35) % grid;
    ctx.beginPath();
    for (let x = off; x < W; x += grid) { ctx.moveTo(x, 0); ctx.lineTo(x, gy); }
    for (let y = 8; y < gy; y += grid) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();

    // petals
    ctx.fillStyle = 'rgba(255,183,213,0.75)';
    for (const p of petals) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.sin(p.ph) * 0.9);
      ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * 0.62, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }

    // ground
    ctx.fillStyle = '#191029'; ctx.fillRect(-12, gy, W + 24, GROUND_H + 12);
    ctx.fillStyle = '#ff7eb6'; ctx.fillRect(-12, gy, W + 24, 4);
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    const goff = -distPx % 46;
    ctx.beginPath();
    for (let x = goff; x < W; x += 46) { ctx.moveTo(x, gy + 6); ctx.lineTo(x - 14, H); }
    ctx.stroke();

    // obstacles
    for (const o of obstacles) {
      if (o.t === 'spike') {
        const base = gy - (o.onBlock || 0);
        ctx.beginPath();
        ctx.moveTo(o.x, base); ctx.lineTo(o.x + o.w / 2, base - o.h); ctx.lineTo(o.x + o.w, base); ctx.closePath();
        ctx.fillStyle = '#0f0a1e'; ctx.fill();
        ctx.strokeStyle = '#e9e4ff'; ctx.lineWidth = 2.5; ctx.stroke();
      } else {
        const top = gy - o.h;
        ctx.fillStyle = '#120b24'; ctx.fillRect(o.x, top, o.w, o.h);
        ctx.strokeStyle = '#cfc4ff'; ctx.lineWidth = 2.5; ctx.strokeRect(o.x, top, o.w, o.h);
        ctx.fillStyle = 'rgba(183,156,237,0.35)'; ctx.fillRect(o.x, top, o.w, 7);
      }
    }

    // dust puffs
    for (const d of dust) {
      ctx.fillStyle = 'rgba(255,214,232,' + (0.55 * d.life / d.max).toFixed(3) + ')';
      ctx.beginPath(); ctx.ellipse(d.x, d.y, d.s * 1.5, d.s, 0, 0, Math.PI * 2); ctx.fill();
    }

    // player（動作に合わせてイラストを切替、足元基準で描画）
    if (state !== 'dead') {
      const img = player.landT > 0 ? SPRITES.land
        : !player.grounded ? SPRITES.jump
        : (player.strideIdx % 2 === 0 ? SPRITES.runA : SPRITES.runB);
      const D = 96; // 表示サイズ（スプライトは256pxキャンバス、キャラは下端254px位置）
      if (img && img.complete && img.naturalWidth) {
        ctx.drawImage(img, 30 + SIZE / 2 - D / 2, player.y + SIZE - D * 254 / 256, D, D);
      } else {
        ctx.fillStyle = '#ffd7ea'; ctx.fillRect(30, player.y, SIZE, SIZE);
      }
    } else if (deadTimer < 0.25) {
      // burst of petals on death
      ctx.fillStyle = 'rgba(255,126,182,0.9)';
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2, r = deadTimer * 260;
        ctx.beginPath();
        ctx.ellipse(30 + SIZE / 2 + Math.cos(a) * r, player.y + SIZE / 2 + Math.sin(a) * r, 6, 4, a, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  // ---------- loop ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    if (state === 'dead') {
      deadTimer += dt;
      if (deadTimer > 0.65 && overlay.classList.contains('hidden')) {
        ovTitle.textContent = '💥 ぶつかっちゃった…';
        ovText.textContent = Math.floor(distPx / 50) + ' m 進んだよ！（BEST ' + Math.floor(best) + ' m）\nもう一回挑戦する？';
        startBtn.textContent = '↻ リトライ';
        overlay.classList.remove('hidden');
      }
    }
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  resize(); reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
